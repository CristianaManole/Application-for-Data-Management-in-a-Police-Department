<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete Nationality</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="d-flex justify-content-between align-items-center my-4">
    <a class="btn btn-secondary" href="/persoane-cetatenii">
      <i class="bi bi-arrow-left-circle"></i> Back to Relations
    </a>
    <h1 class="text-center mb-0">Delete Nationality</h1>
  </div>

  <form action="/persoane-cetatenii/delete-choose" method="post">
    <input type="hidden" name="idPersoana" th:value="${idPersoana}">
    <div class="mb-3">
      <label for="idCetatenie" class="form-label">Select Nationality</label>
      <select class="form-select" id="idCetatenie" name="idCetatenie" required>
        <option th:each="nationality : ${cetatenii}"
                th:value="${nationality[0]}"
                th:text="${nationality[1]}">
        </option>
      </select>
    </div>
    <button type="submit" class="btn btn-danger">Delete</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
