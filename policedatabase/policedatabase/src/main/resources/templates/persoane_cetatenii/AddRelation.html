<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Relation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <h1 class="text-center my-4">Add Citizenship</h1>
  <form method="post" th:action="@{/persoane-cetatenii/add}">
    <!-- Select Persoană -->
    <div class="form-group mb-3">
      <label for="idPersoana">Person</label>
      <select id="idPersoana" name="idPersoana" class="form-control" required>
        <option th:each="person : ${persoane}" th:value="${person.idPersoana}" th:text="${person.nume + ' ' + person.prenume}">
        </option>
      </select>
    </div>

    <!-- Select Cetățenie -->
    <div class="form-group mb-3">
      <label for="idCetatenie">Citizenship</label>
      <select id="idCetatenie" name="idCetatenie" class="form-control" required>
        <option th:each="citizenship : ${cetatenii}" th:value="${citizenship.idCetatenie}" th:text="${citizenship.nationalitate}">
        </option>
      </select>
    </div>

    <!-- Butoane -->
    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Add Relation
      </button>
      <a href="/persoane-cetatenii" class="btn btn-secondary">
        <i class="bi bi-arrow-left-circle"></i> Cancel
      </a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
