<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Officers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <!-- Secțiunea pentru titlu și butoane -->
    <div class="d-flex justify-content-between align-items-center my-4">
        <!-- Buton pentru revenire la pagina principală -->
        <a class="btn btn-secondary" href="/">
            <i class="bi bi-arrow-left-circle"></i> Back to Home
        </a>
        <h1 class="text-center mb-0">Officers</h1>
        <a class="btn btn-primary" href="/officers/add">
            <i class="bi bi-plus-circle"></i> Add Officer
        </a>
    </div>

    <!-- Tabelul pentru afișarea ofițerilor -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Last Name</th>
                <th>First Name</th>
                <th>Rank</th>
                <th>CNP</th>
                <th>Sex</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="officer : ${officers}">
                <td th:text="${officer.nume}"></td>
                <td th:text="${officer.prenume}"></td>
                <td th:text="${officer.grad}"></td>
                <td th:text="${officer.cnp}"></td>
                <td th:text="${officer.sex}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a class="btn btn-primary btn-sm" th:href="@{/officers/edit/{id}(id=${officer.idOfiter})}">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a class="btn btn-danger btn-sm" th:href="@{/officers/delete/{id}(id=${officer.idOfiter})}" onclick="return confirm('Are you sure you want to delete this officer?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="mt-3">
            <a href="/officers/cases-per-officer" class="btn btn-success">
                View Cases Per Officer
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
