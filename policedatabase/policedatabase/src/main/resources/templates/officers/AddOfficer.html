<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Officer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <h1 class="text-center my-4">Add Officer</h1>
  <form method="post" th:action="@{/officers/add}" th:object="${ofiter}">
    <!-- Nume -->
    <div class="form-group mb-3">
      <label for="nume">Last Name</label>
      <input id="nume" class="form-control" th:field="*{nume}" placeholder="Enter last name" required>
    </div>
    <!-- Prenume -->
    <div class="form-group mb-3">
      <label for="prenume">First Name</label>
      <input id="prenume" class="form-control" th:field="*{prenume}" placeholder="Enter first name" required>
    </div>
    <!-- Grad -->
    <div class="form-group mb-3">
      <label for="grad">Rank</label>
      <input id="grad" class="form-control" th:field="*{grad}" placeholder="Enter rank" required>
    </div>
    <!-- CNP -->
    <div class="form-group mb-3">
      <label for="cnp">CNP</label>
      <input id="cnp" class="form-control" th:field="*{cnp}" placeholder="Enter CNP" required>
    </div>
    <!-- Sex -->
    <div class="form-group mb-3">
      <label for="sex">Sex</label>
      <select id="sex" class="form-control" th:field="*{sex}">
        <option value="M">Male</option>
        <option value="F">Female</option>
      </select>
    </div>
    <!-- Butoane -->
    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Add Officer
      </button>
      <a href="/officers" class="btn btn-secondary">
        <i class="bi bi-arrow-left-circle"></i> Cancel
      </a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
