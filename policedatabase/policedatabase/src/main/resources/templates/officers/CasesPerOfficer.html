<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cases Per Officer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <h1 class="text-center my-4">Number of Cases Per Officer</h1>
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Last Name</th>
      <th>First Name</th>
      <th>Number of Cases</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="officer : ${officersWithCases}">
      <td th:text="${officer[1]}"></td>
      <td th:text="${officer[2]}"></td>
      <td th:text="${officer[3]}"></td>
    </tr>
    </tbody>
  </table>
  <a href="/officers" class="btn btn-secondary mt-3">Back to Officers</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
