<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Person</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="form-container">
    <h1>Edit Person</h1>

    <!-- Formularul de editare -->
    <form method="post" th:object="${personDto}" th:action="@{/people/edit/{id}(id=${personDto.idPersoana})}">
        <div th:if="${#fields.hasErrors()}" class="alert alert-danger">
            <ul>
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
        </div>
        <!-- ID-ul persoanei (hidden, deoarece nu trebuie afișat, dar trebuie trimis în backend) -->
        <input type="hidden" th:field="*{idPersoana}">

        <!-- Nume -->
        <div class="form-group">
            <label for="nume">Last Name</label>
            <input id="nume" class="form-control" th:field="*{nume}">
        </div>

        <!-- Prenume -->
        <div class="form-group">
            <label for="prenume">First Name</label>
            <input id="prenume" class="form-control" th:field="*{prenume}">
        </div>

        <!-- CNP-ul persoanei -->
        <div class="form-group">
            <label for="cnp">CNP</label>
            <input id="cnp" class="form-control" th:field="*{cnp}">
        </div>

        <!-- Sex -->
        <div class="form-group">
            <label for="sex">Sex</label>
            <select id="sex" class="form-control" th:field="*{sex}">
                <option value="M">Male</option>
                <option value="F">Female</option>
            </select>
        </div>

        <!-- Data nașterii -->
        <div class="form-group">
            <label for="dataNasterii">Date of Birth</label>
            <input id="dataNasterii" type="date" class="form-control" th:field="*{dataNasterii}">
        </div>

        <!-- Adresa -->
        <div class="form-group">
            <label for="adresa">Address</label>
            <select id="adresa" class="form-control" th:field="*{idAdresa}">
                <option th:each="adresa : ${adrese}"
                        th:value="${adresa.idAdresa}"
                        th:text="${adresa.strada + ', ' + adresa.numar + ', ' + adresa.oras + ', ' + adresa.judet}">
                </option>
            </select>
        </div>

        <!-- Butoane pentru salvare și anulare -->
        <div class="form-group text-center">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Save Changes
            </button>
            <a href="/people" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i> Cancel
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
