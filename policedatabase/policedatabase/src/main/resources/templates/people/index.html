<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Police Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <!-- Secțiunea pentru titlu și butoane -->
    <div class="d-flex justify-content-between align-items-center my-4">
        <!-- Buton pentru revenire la pagina principală -->
        <a class="btn btn-secondary" href="/">
            <i class="bi bi-arrow-left-circle"></i> Back to Home
        </a>
        <h1 class="text-center mb-0">People</h1>
        <a class="btn btn-primary" href="/people/add">
            <i class="bi bi-plus-circle"></i> Add Person
        </a>
    </div>

    <!-- Tabelul pentru afișarea persoanelor -->
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
            <tr>
                <th>Last Name</th>
                <th>First Name</th>
                <th>CNP</th>
                <th>Sex</th>
                <th>Date of Birth</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="person : ${people}">
                <td th:text="${person.nume}"></td>
                <td th:text="${person.prenume}"></td>
                <td th:text="${person.cnp}"></td>
                <td th:text="${person.sex}"></td>
                <td th:text="${#dates.format(person.dataNasterii, 'dd-MM-yyyy')}"></td>
                <td th:text="${person.adresa}"></td>
                <td>
                    <div class="btn-group" role="group">
                        <a class="btn btn-primary btn-sm" th:href="@{/people/edit/{id}(id=${person.idPersoana})}">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a class="btn btn-danger btn-sm" th:href="@{/people/delete/{id}(id=${person.idPersoana})}" onclick="return confirm('Are you sure you want to delete this person?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="mt-4">
            <!-- Persoana cu cele mai multe dosare -->
            <div class="card border-light mb-3 shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h3>Person with the Most Cases</h3>
                </div>
                <div class="card-body text-center" style="background-color: rgba(0, 123, 255, 0.1);">
                    <h5 class="card-title">
                        Name: <span th:text="${personWithMostCases.nume} + ' ' + ${personWithMostCases.prenume}"></span>
                    </h5>
                </div>
            </div>

            <!-- Persoana cu cele mai multe cetățenii -->
            <div class="card border-light mb-3 shadow-sm">
                <div class="card-header bg-info text-white text-center">
                    <h3>Person with the Most Citizenships</h3>
                </div>
                <div class="card-body text-center" style="background-color: rgba(23, 162, 184, 0.1);">
                    <h5 class="card-title">
                        Name: <span th:text="${personWithMostCitizenships[1]} + ' ' + ${personWithMostCitizenships[2]}"></span>
                    </h5>
                </div>
            </div>
        </div>


    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
