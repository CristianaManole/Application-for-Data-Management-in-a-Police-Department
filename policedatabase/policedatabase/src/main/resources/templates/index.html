<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Police Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1 class="text-center my-4">Welcome to the Police Database</h1>
    <p class="text-center">Manage and view records efficiently.</p>

    <!-- Secțiunea pentru butoane -->
    <div class="d-flex justify-content-center mb-4">
        <a class="btn btn-success mx-2" href="/people">
            <i class="bi bi-people"></i> People
        </a>
        <a class="btn btn-success mx-2" href="/addresses">
            <i class="bi bi-geo-alt"></i> Addresses
        </a>
        <a class="btn btn-success mx-2" href="/officers">
            <i class="bi bi-person-badge"></i> Officers
        </a>
        <a class="btn btn-success mx-2" href="/citizens">
            <i class="bi bi-flag"></i> Citizenships
        </a>
        <a class="btn btn-success mx-2" href="/persoane-cetatenii">
            <i class="bi bi-link"></i> People & Citizenships
        </a>
        <a class="btn btn-success mx-2" href="/cases">
            <i class="bi bi-file-earmark-text"></i> View Cases
        </a>
    </div>

    <!-- Caseta de căutare -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h4>Search People by City</h4>
        </div>
        <div class="card-body">
            <form method="get" action="/">
                <div class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="city" class="col-form-label">Select City:</label>
                    </div>
                    <div class="col-auto">
                        <select id="city" name="city" class="form-select">
                            <option value="">-- Select City --</option>
                            <option th:each="city : ${cities}" th:value="${city}" th:text="${city}"
                                    th:selected="${selectedCity == city}"></option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Search</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Rezultatele căutării -->
    <div class="card">
        <div class="card-header bg-secondary text-white">
            <h4>Search Results</h4>
        </div>
        <div class="card-body">
            <div th:if="${people != null}">
                <h5 th:if="${people.isEmpty()}" class="text-center">No people found in the selected city.</h5>
                <table th:if="${!people.isEmpty()}" class="table table-hover">
                    <thead>
                    <tr>
                        <th>Last Name</th>
                        <th>First Name</th>
                        <th>CNP</th>
                        <th>Sex</th>
                        <th>Date of Birth</th>
                        <th>Address</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="person : ${people}">
                        <td th:text="${person.nume}"></td>
                        <td th:text="${person.prenume}"></td>
                        <td th:text="${person.cnp}"></td>
                        <td th:text="${person.sex}"></td>
                        <td th:text="${#dates.format(person.dataNasterii, 'dd-MM-yyyy')}"></td>
                        <td th:text="${person.adresa}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
