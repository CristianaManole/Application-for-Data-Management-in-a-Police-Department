<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cases</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <div class="d-flex justify-content-between align-items-center my-4">
    <a class="btn btn-secondary" href="/">
      <i class="bi bi-arrow-left-circle"></i> Back to Home
    </a>
    <h1 class="text-center">Cases</h1>
    <a class="btn btn-primary" href="/cases/add">
      <i class="bi bi-plus-circle"></i> Add Case
    </a>
  </div>

  <!-- Dropdown pentru selecția ofițerului -->
  <div class="my-4">
    <form action="/cases/search" method="get">
      <label for="officerName" class="form-label">Select Officer</label>
      <select name="officerName" id="officerName" class="form-select">
        <option value="All" th:selected="${'All' == selectedOfficer}">All</option> <!-- Opțiunea "All" -->
        <th:block th:each="officer : ${officers}">
          <option th:value="${officer.nume}" th:text="${officer.nume}"
                  th:selected="${officer.nume == selectedOfficer}"></option>
        </th:block>
      </select>
      <button type="submit" class="btn btn-primary mt-2">Search Cases</button>
    </form>
  </div>

  <!-- Tabelul pentru afișarea dosarelor -->
  <table class="table table-hover">
    <thead>
    <tr>
      <th>Case Number</th>
      <th>Description</th>
      <th>Registration Date</th>
      <th>Officer</th>
      <th>Person</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="case : ${cases}">
      <td th:text="${case[1]}"></td>
      <td th:text="${case[2]}"></td>
      <td th:text="${#dates.format(case[3], 'yyyy-MM-dd')}"></td>
      <td th:text="${case[4]} + ' ' + ${case[5]}"></td>
      <td th:text="${case[6]} + ' ' + ${case[7]}"></td>
      <td>
        <!-- Edit button -->
        <a class="btn btn-primary btn-sm" th:href="@{/cases/edit/{id}(id=${case[0]})}">
          <i class="bi bi-pencil"></i> Edit
        </a>
        <!-- Delete button -->
        <a class="btn btn-danger btn-sm" th:href="@{/cases/delete/{id}(id=${case[0]})}" onclick="return confirm('Are you sure?')">
          <i class="bi bi-trash"></i> Delete
        </a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
