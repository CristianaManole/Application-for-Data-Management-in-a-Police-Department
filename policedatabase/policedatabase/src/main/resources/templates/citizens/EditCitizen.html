<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Citizenship</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <h1 class="text-center my-4">Edit Citizenship</h1>
  <form method="post" th:action="@{/citizens/edit/{id}(id=${citizen.idCetatenie})}" th:object="${citizen}">
    <!-- Țară -->
    <div class="form-group mb-3">
      <label for="tara">Country</label>
      <input id="tara" class="form-control" th:field="*{tara}" required>
    </div>
    <!-- Naționalitate -->
    <div class="form-group mb-3">
      <label for="nationalitate">Nationality</label>
      <input id="nationalitate" class="form-control" th:field="*{nationalitate}" required>
    </div>
    <!-- Butoane -->
    <div class="text-center">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save"></i> Save Changes
      </button>
      <a href="/citizens" class="btn btn-secondary">
        <i class="bi bi-arrow-left-circle"></i> Cancel
      </a>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
