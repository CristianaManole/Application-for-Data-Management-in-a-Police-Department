<!doctype html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citizenships</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
  <!-- Secțiunea pentru titlu și butoane -->
  <div class="d-flex justify-content-between align-items-center my-4">
    <!-- Buton pentru revenire la pagina principală -->
    <a class="btn btn-secondary" href="/">
      <i class="bi bi-arrow-left-circle"></i> Back to Home
    </a>
    <h1 class="text-center mb-0">Citizenships</h1>
    <a class="btn btn-primary" href="/citizens/add">
      <i class="bi bi-plus-circle"></i> Add Citizenship
    </a>
  </div>

  <!-- Tabelul pentru afișarea cetățeniilor -->
  <div class="table-responsive">
    <table class="table table-hover">
      <thead>
      <tr>
        <th class="text-center">Country</th>
        <th class="text-center">Nationality</th>
        <th class="text-center">Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="citizen : ${citizenships}">
        <td class="text-center" th:text="${citizen.tara}"></td>
        <td class="text-center" th:text="${citizen.nationalitate}"></td>
        <td class="text-center">
          <div class="btn-group" role="group">
            <a class="btn btn-primary btn-sm" th:href="@{/citizens/edit/{id}(id=${citizen.idCetatenie})}">
              <i class="bi bi-pencil"></i> Edit
            </a>
            <a class="btn btn-danger btn-sm" th:href="@{/citizens/delete/{id}(id=${citizen.idCetatenie})}" onclick="return confirm('Are you sure you want to delete this citizenship?')">
              <i class="bi bi-trash"></i> Delete
            </a>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
